[project]
name = "dqn-exploration-strategies"
version = "0.1.0"
description = "Exploration strategies for DQN algorithm in the Lunar Lander environment"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "gymnasium[box2d]>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "jupyter>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]